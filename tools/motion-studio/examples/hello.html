<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion studio smoke test</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
  .stage { position: relative; width: 1280px; height: 720px; font-family: Georgia, "Times New Roman", serif; color: #f4ede3; }
  .bar { position: absolute; left: 96px; top: 160px; width: 14px; height: 0; background: #e8553a; }
  .line { position: absolute; left: 140px; font-size: 92px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
  .l1 { top: 150px; } .l2 { top: 260px; }
  .tag { position: absolute; left: 140px; top: 430px; font: 500 26px/1.4 system-ui, sans-serif; color: #c9bfb0; }
</style>
</head>
<body>
<div class="stage">
  <div class="bar" id="bar"></div>
  <div class="line l1" id="l1">Drawn by hand,</div>
  <div class="line l2" id="l2">printed to colour in.</div>
  <div class="tag" id="tag">Frame-by-frame springs, no CSS easing.</div>
</div>
<script src="../scripts/springs.js"></script>
<script>
  const el = id => document.getElementById(id);
  window.renderFrame = function (t) {
    const s1 = spring(t, { stiffness: 140, damping: 16 });
    const s2 = spring(t - 0.18, { stiffness: 140, damping: 16 });
    const s3 = spring(t - 0.5, { stiffness: 120, damping: 22 });
    el("bar").style.height = 230 * spring(t, { stiffness: 90, damping: 18 }) + "px";
    el("l1").style.transform = "translateX(" + (1 - s1) * -120 + "px)";
    el("l1").style.opacity = 1;
    el("l2").style.transform = "translateX(" + (1 - s2) * -120 + "px)";
    el("tag").style.transform = "translateY(" + (1 - s3) * 28 + "px)";
    el("tag").style.opacity = Math.min(1, Math.max(0, s3));
  };
  window.renderFrame(0);
</script>
</body>
</html>
